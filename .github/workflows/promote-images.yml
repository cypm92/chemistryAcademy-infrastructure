name: Proponer nuevas imágenes de producción

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promote-production-images
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment:
      name: INFRA_PROMOTION_TOKEN
      deployment: false
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar y proponer imágenes publicadas
        env:
          GH_TOKEN: ${{ secrets.INFRA_PROMOTION_TOKEN }}
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo 'Sin INFRA_PROMOTION_TOKEN: no se puede comprobar la promoción.' >&2
            exit 1
          fi
          python -m unittest discover -s scripts -p 'test_promote_images.py' -v
          python -m unittest discover -s scripts -p 'test_promotion_branch.py' -v
          python -m unittest discover -s scripts -p 'test_propose_flow.py' -v
          bash scripts/propose-images.sh
