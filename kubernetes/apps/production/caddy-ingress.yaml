apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-ingress-config
  namespace: beciencia
  labels:
    app.kubernetes.io/name: caddy-ingress
    app.kubernetes.io/part-of: beciencia
data:
  Caddyfile: |
    beciencia.es, www.beciencia.es {
      encode zstd gzip
      reverse_proxy frontend.beciencia.svc.cluster.local:80
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: caddy-data
  namespace: beciencia
  labels:
    app.kubernetes.io/name: caddy-ingress
    app.kubernetes.io/part-of: beciencia
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy-ingress
  namespace: beciencia
  labels:
    app.kubernetes.io/name: caddy-ingress
    app.kubernetes.io/part-of: beciencia
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: caddy-ingress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caddy-ingress
        app.kubernetes.io/part-of: beciencia
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caddy
          image: caddy:2.10.2-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              hostPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              hostPort: 443
              protocol: TCP

          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: config
              mountPath: /etc/caddy
              readOnly: true
            - name: data
              mountPath: /data
            - name: config-storage
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: caddy-ingress-config
        - name: data
          persistentVolumeClaim:
            claimName: caddy-data
        - name: config-storage
          emptyDir: {}
