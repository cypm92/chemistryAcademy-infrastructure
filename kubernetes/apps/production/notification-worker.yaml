apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
  namespace: beciencia
  labels:
    app.kubernetes.io/name: notification-worker
    app.kubernetes.io/part-of: beciencia
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-worker
        app.kubernetes.io/part-of: beciencia
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notification-worker
          image: ghcr.io/cypm92/beciencia-backend:sha-cf1baf872a6b4082ad5687a672303255216cc5d3
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.notification_worker"]
          env:
            - name: MICROSOFT_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: beciencia-runtime
                  key: MICROSOFT_TENANT_ID
            - name: MICROSOFT_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: beciencia-runtime
                  key: MICROSOFT_CLIENT_ID
            - name: MICROSOFT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: beciencia-runtime
                  key: MICROSOFT_CLIENT_SECRET
            - name: MICROSOFT_FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: beciencia-runtime
                  key: MICROSOFT_FERNET_KEY
            - name: MICROSOFT_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: beciencia-settings
                  key: MICROSOFT_REDIRECT_URI
            - name: MICROSOFT_SYNC_ENABLED
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: beciencia-runtime
                  key: DATABASE_URL
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: beciencia-runtime
                  key: SMTP_PASSWORD
                  optional: false
            - name: SMTP_MODE
              valueFrom:
                configMapKeyRef:
                  name: beciencia-settings
                  key: SMTP_MODE
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: beciencia-settings
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: beciencia-settings
                  key: SMTP_PORT
            - name: SMTP_SSL
              valueFrom:
                configMapKeyRef:
                  name: beciencia-settings
                  key: SMTP_SSL
            - name: SMTP_STARTTLS
              valueFrom:
                configMapKeyRef:
                  name: beciencia-settings
                  key: SMTP_STARTTLS
            - name: SMTP_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: beciencia-settings
                  key: SMTP_USERNAME
            - name: SMTP_SENDER
              valueFrom:
                configMapKeyRef:
                  name: beciencia-settings
                  key: SMTP_SENDER
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
